spring:
  datasource:
    url: jdbc:sqlite:./banking.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  security:
    user:
      name: ignored

server:
  port: 8080

logging:
  level:
    com.example.banking: DEBUG
    org.springframework.security: INFO
